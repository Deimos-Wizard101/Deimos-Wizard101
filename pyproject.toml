[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deimos-wizard101"
version = "3.14.0"
description = "A Wizard101 automation tool"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.2",
    "pypresence>=4.3.0",
    "pyperclip>=1.9.0",
    "PyQt6>=6.6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.3",
    "thefuzz>=0.22.1",
    "wizwalker",
    "wizsprinter",
    "wizlaunch",
    "kinif",
    "numpy>=2.4.6",
    "shapely>=2.1.2",
    "katsuba>=0.4.0",
    "wiztype>=0.1.12",
    "keystone-engine>=0.9.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
override-dependencies = ["pefile>=2024.8.26"]

[tool.uv.workspace]
members = ["libs/wizwalker", "libs/wizsprinter", "libs/wizlaunch", "libs/kinif"]

[tool.uv.sources]
wizwalker = { workspace = true }
wizsprinter = { workspace = true }
wizlaunch = { workspace = true }
kinif = { workspace = true }

[dependency-groups]
dev = ["pyinstaller>=6.0"]
